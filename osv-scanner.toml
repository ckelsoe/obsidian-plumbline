[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch: denial of service when a crafted glob pattern is compiled with optimizationLevel 2 or higher. Affects 7.0.0 up to 11.0.1. Only one copy is still affected: 8.0.7, required by eslint-plugin-json-schema-validator 5.x through eslint-plugin-obsidianmd 0.4.x, which loads it as a default import; 11 has no default export, so it cannot be forced. Dev-only: it matches this repo's own config patterns against its own source; nothing ships in main.js. eslint-plugin-obsidianmd 0.5.x uses minimatch 10 (overridden to 11) and removes this copy; that bump lands in the plugin's next reviewed PR, because its new prefer-instanceof rule needs a source change that alters main.js. Drop this entry with that bump."

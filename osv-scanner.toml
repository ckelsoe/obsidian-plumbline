# OSV-Scanner suppressions. Every entry must document why the advisory is
# accepted and what would let us drop it. Revisit whenever the dependency tree
# changes (a new lockfile may remove the transitive path entirely).
#
# One active suppression, below: the minimatch copies no override can reach
# yet. The deepmerge advisory left with Jest (2026-11-11): Vitest does not use
# deepmerge. Most minimatch 9 and 10 copies move to 11 through version-keyed
# `overrides` (`minimatch@9`, `minimatch@10`), which leave eslint's own 3.x
# copies alone (2026-11-11). The glob advisory is fixed through `overrides`
# (2026-11-04). The braces entry was dropped 2026-11-04: GitHub withdrew
# GHSA-vfj7-8cjw-p6xm on 2026-10-23. Every other dev-only transitive advisory
# is FIXED rather than ignored: the package.json `overrides` block pins
# brace-expansion, js-yaml, fast-uri, handlebars, moment and smol-toml to
# patched versions.
#
# Add an [[IgnoredVulns]] entry here only for an advisory with no non-breaking
# fix, and document why and what would let us drop it.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch: denial of service when a crafted glob pattern is compiled with optimizationLevel 2 or higher. Affects 7.0.0 up to 11.0.1. Version-keyed overrides move most 9.x and 10.x copies to 11. Two copies are left. 8.0.7 is required by eslint-plugin-json-schema-validator 5.x through eslint-plugin-obsidianmd 0.4.x, which loads it as a default import, and 11 has no default export. 10.2.6 is required by type-coverage-core (range 6 || 7 || 8 || 9 || 10): npm 10, which CI runs and which writes this lockfile, does not apply the `minimatch@10` override to that range, though npm 12 does. Dev-only: it matches this repo's own config patterns against its own source; nothing ships in main.js. This entry is by advisory id, so the short expiry forces a re-check. Drop it when eslint-plugin-obsidianmd moves to 0.5.x (whose json-schema-validator uses minimatch 10) and type-coverage-core accepts minimatch 11 or CI moves to npm 12."
